name: rabot.energy
description: 'rabot.energy (RABOT Energy DE GmbH) is a Hamburg-based German electricity supplier
  offering dynamic and fixed-rate power tariffs where consumers pay hourly rates that track the
  wholesale electricity market. The company provides 100% renewable energy certified by TÜV NORD,
  smart meter installation and management, EV charging optimization (Autostrom), and home battery
  storage (Rabot Flow), all managed through a consumer mobile app for consumption monitoring. It is
  a consumer-facing energy retailer; no public developer portal or API is currently published. Added
  to the API Evangelist network as a portfolio company of HV Capital.'
